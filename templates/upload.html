<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klasifikasi Daun Tomat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Dark Mode Toggle (pojok kanan atas) -->
        <div class="toggle-container">
            <label class="switch">
                <input type="checkbox" id="darkToggle">
                <span class="slider round"></span>
            </label>
            <span class="toggle-label">Dark Mode</span>
        </div>

        <!-- Logo di tengah -->
        <img src="{{ url_for('static', filename='buah-tomat.png') }}" class="logo" alt="Logo Tomat" onerror="this.style.display='none'">

        <!-- Judul -->
        <h1>Klasifikasi Penyakit Daun Tomat</h1>

        <!-- Form Upload -->
        <form method="post" enctype="multipart/form-data" onsubmit="showLoading()">
            <label class="custom-file-upload">
                <input type="file" name="file" id="fileInput" accept="image/*" required onchange="showSuccess()">
                Upload Gambar
            </label>
            <br>
            <div id="successCheck" style="display:none; margin-top: 10px;">
                ✅ Gambar berhasil dipilih
            </div>
            <br>
            <button type="submit" id="submitBtn">Klasifikasi</button>
        </form>

        <!-- Loading saat proses -->
        <div id="loading" style="display:none; margin-top: 20px;">
            <p>Sedang mengupload dan menganalisis gambar...</p>
            <div class="loader"></div>
        </div>

        <!-- Ilustrasi Gambar -->
        <img src="{{ url_for('static', filename='daun_tomat.png') }}" class="tomato-leaf" alt="Contoh Daun Tomat" onerror="this.style.display='none'">
    </div>

    <!-- Script -->
    <script>
        //  Dark mode toggle tetap aktif
        const toggle = document.getElementById('darkToggle');
        const isDark = localStorage.getItem('dark-mode') === 'true';

        if (isDark) {
            document.body.classList.add('dark-mode');
            if (toggle) toggle.checked = true;
        }

        if (toggle) {
            toggle.addEventListener('change', function () {
                document.body.classList.toggle('dark-mode');
                localStorage.setItem('dark-mode', toggle.checked);
            });
        }

        //  Tampilkan loading saat form dikirim
        function showLoading() {
            document.getElementById('submitBtn').style.display = 'none';
            document.querySelector('.custom-file-upload').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
        }

        //  Tampilkan centang saat file berhasil dipilih
        function showSuccess() {
            document.getElementById('successCheck').style.display = 'block';
        }
    </script>
</body>
</html>
