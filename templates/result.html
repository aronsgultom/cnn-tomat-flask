<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Hasil Klasifikasi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Kontainer utama -->
    <div class="container green-style">

    <!-- Toggle Dark Mode -->
    <div class="toggle-container">
        <label class="switch">
            <input type="checkbox" id="darkToggle">
            <span class="slider round"></span>
        </label>
        <span class="toggle-label">Dark Mode</span>
    </div>


    <!-- Logo -->
    <div class="logo-container">
        <img src="{{ url_for('static', filename='buah-tomat.png') }}" 
             class="logo" alt="Logo UNIMED" 
             onerror="this.style.display='none'">
    </div>

        <!-- Gambar hasil upload -->
        <div class="image-container">
            <img src="{{ image_path }}" class="uploaded-img" alt="Daun Tomat">
        </div>

        <!-- Hasil diagnosis -->
        <div class="result-container">
            <h3>Penyakit yang menyerang Daun Tomat anda adalah:</h3>
            <h2 class="diagnosis">{{ label }}</h2>
        </div>

        <!-- Probabilitas -->
        <div class="probability-container">
            <h4>Probabilitas:</h4>
            <div class="probabilities">
                {% for class_name, prob in predictions %}
                    <p>{{ class_name }}: {{ prob }}</p>
                {% endfor %}
            </div>
        </div>

        <hr>

        <!-- Keterangan penyakit -->
        <div class="description-container">
            <h4>Keterangan Penyakit:</h4>
            <p>{{ description }}</p>
        </div>

        <!-- Tombol kembali -->
        <div class="button-container">
            <a href="/" class="back-button">Kembali</a>
        </div>
    </div>

    <!-- Script Dark Mode -->
    <script>
        const toggle = document.getElementById('darkToggle');
        const isDark = localStorage.getItem('dark-mode') === 'true';

        if (isDark) {
            document.body.classList.add('dark-mode');
            if (toggle) toggle.checked = true;
        }

        if (toggle) {
            toggle.addEventListener('change', function () {
                document.body.classList.toggle('dark-mode');
                localStorage.setItem('dark-mode', toggle.checked);
            });
        }
    </script>
</body>
</html>
